name: Build Projektorlage v2 Safe

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'payload/v2_safe.b64'
      - '.github/workflows/build-v2-safe.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild safe v2 source
        shell: bash
        run: |
          base64 --decode payload/v2_safe.b64 > projektor-v2-safe.zip
          mkdir src
          unzip -q projektor-v2-safe.zip -d src

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 35 platform
        shell: bash
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: src
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare named APK
        shell: bash
        run: cp src/app/build/outputs/apk/debug/app-debug.apk Projektorlage-v2.0-safe.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Projektorlage-v2.0-safe-apk
          path: Projektorlage-v2.0-safe.apk
          if-no-files-found: error

      - name: Publish safe release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release view v2.0-safe >/dev/null 2>&1 || gh release create v2.0-safe --title "Projektorläge v2.0 Safe" --notes "Ren fjärrkontroll/projektor-server. Inga overlays, ingen systemrotation, ingen systemljusstyrka. Automatisk nätverksupptäckt och STOPPA FJÄRR i notisen."
          gh release upload v2.0-safe Projektorlage-v2.0-safe.apk --clobber
