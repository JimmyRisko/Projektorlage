name: Build Projektorlage APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'payload/**'
      - 'patch/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild source archive
        shell: bash
        run: |
          cat payload/part1.b64 payload/part2.b64 payload/part3.b64 payload/part4.b64 payload/part5.b64 | base64 --decode > projektorlage-src.zip
          mkdir src
          unzip -q projektorlage-src.zip -d src

      - name: Apply v0.3 patch
        run: python patch/apply_v03.py src
      - name: Apply v0.4 rotation fix
        run: python patch/apply_v04.py src
      - name: Apply v0.5 remote recovery
        run: python patch/apply_v05.py src
      - name: Apply v0.6 local video player
        run: python patch/apply_v06.py src
      - name: Apply v0.7 experimental system mirror
        run: python patch/apply_v07.py src
      - name: Apply v0.8 MediaProjection fix
        run: python patch/apply_v08.py src
      - name: Apply v0.9 single-app mirror
        run: python patch/apply_v09.py src
      - name: Apply v1.0 projector light boost
        run: python patch/apply_v10.py src
      - name: Apply v1.1 remote stability fix
        run: python patch/apply_v11.py src
      - name: Apply v1.2 full restore
        run: python patch/apply_v12.py src
      - name: Apply v1.3 LAN permission and repair
        run: python patch/apply_v13.py src
      - name: Apply v1.4 one-tap projector
        run: python patch/apply_v14.py src
      - name: Apply v1.5 simplified consumer UX
        run: python patch/apply_v15.py src
      - name: Apply v1.6 remote protocol fix
        run: python patch/apply_v16.py src
      - name: Apply v1.7 automatic discovery
        run: python patch/apply_v17.py src
      - name: Apply v1.8 integrated mirror projector
        run: python patch/apply_v18.py src
      - name: Apply v1.9 no gray veil
        run: python patch/apply_v19.py src
      - name: Apply v2.0 GPU projector profiles
        run: python patch/apply_v20.py src
      - name: Apply v2.1 OpenGL mirror pipeline
        run: python patch/apply_v21.py src
      - name: Apply v2.2 reliable brightness
        run: python patch/apply_v22.py src

      - name: Apply v2.3 product-ready fixes
        working-directory: src
        shell: bash
        run: |
          patch -p1 < ../patch/v23_main.patch
          patch -p1 < ../patch/v23_permission.patch
          patch -p1 < ../patch/v23_mirror.patch
          patch -p1 < ../patch/v23_rotation.patch
          patch -p1 < ../patch/v23_meta.patch
          patch -p1 < ../patch/v23_hardening.patch

      - name: Validate v2.3 critical behavior
        working-directory: src
        run: python ../patch/validate_v23.py .

      - name: Package patched source snapshot
        shell: bash
        run: zip -qr Projektorlage-patched-source.zip src

      - name: Upload patched source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: Projektorlage-patched-source
          path: Projektorlage-patched-source.zip
          if-no-files-found: error

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 35 platform
        shell: bash
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Lint debug
        working-directory: src
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: gradle :app:lintDebug --stacktrace

      - name: Build debug APK
        working-directory: src
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare named APK
        shell: bash
        run: cp src/app/build/outputs/apk/debug/app-debug.apk Projektorlage-v2.3.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Projektorlage-v2.3-debug-apk
          path: Projektorlage-v2.3.apk
          if-no-files-found: error

      - name: Publish test release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release view v2.3-test >/dev/null 2>&1 || gh release create v2.3-test --prerelease --title "Projektorläge v2.3 test" --notes "Förhandsversion efter produktgranskning: verifierad rotation och ljusstyrka, appbaserad skärmdelning för att undvika återkopplingsloopen, korrigerad OpenGL-spegelaxel, borttagen vit boost och tydlig startstatus."
          gh release upload v2.3-test Projektorlage-v2.3.apk --clobber
