name: Build Projektorlage APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'payload/**'
      - 'patch/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild source archive
        shell: bash
        run: |
          cat payload/part1.b64 payload/part2.b64 payload/part3.b64 payload/part4.b64 payload/part5.b64 | base64 --decode > projektorlage-src.zip
          mkdir src
          unzip -q projektorlage-src.zip -d src

      - name: Apply v0.3 patch
        shell: bash
        run: python patch/apply_v03.py src

      - name: Apply v0.4 rotation fix
        shell: bash
        run: python patch/apply_v04.py src

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 35 platform
        shell: bash
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: src
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare named APK
        shell: bash
        run: cp src/app/build/outputs/apk/debug/app-debug.apk Projektorlage-v0.4.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Projektorlage-v0.4-debug-apk
          path: Projektorlage-v0.4.apk
          if-no-files-found: error

      - name: Publish test release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release view v0.4-test >/dev/null 2>&1 || gh release create v0.4-test --title "Projektorläge v0.4 test" --notes "Rotationen styr nu Androids systemrotation (90°/270°) i stället för att bara begära orientering via overlay."
          gh release upload v0.4-test Projektorlage-v0.4.apk --clobber
